name: plymouth-housing

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/plymouth-housing:cached
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Plymouth-Local-Dev-1}
      DATABASE_CONNECTION_STRING:
        'Server=sql,1433;Database=Inventory;User
        Id=sa;Password=${MSSQL_SA_PASSWORD:-Plymouth-Local-Dev-1};TrustServerCertificate=True;'
      DAB_HOST_MODE: development
    depends_on:
      sql:
        condition: service_healthy

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Plymouth-Local-Dev-1}
    volumes:
      - sqlserverdata:/var/opt/mssql
    healthcheck:
      test:
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P
        "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  sqlserverdata:
