version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    # Every Dependabot PR rewrites package-lock.json, so separate PRs conflict
    # with each other as soon as one merges. Groups keep the routine traffic to
    # one PR per kind of update.
    groups:
      # Minor version bumps, batched into a single monthly PR. Patch bumps are
      # ignored below; the auto-merge workflow merges this PR once CI passes.
      npm-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
      # Security fixes are not covered by version-update groups, so without
      # this each advisory opens its own PR.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Major bumps are deliberately not grouped: each one opens its own PR to
      # review or ignore on its own. Bundling them with routine bumps let
      # TypeScript 7 and vitest 5 break install and CI in #634.
    # Ignore patch updates (e.g., 1.0.0 -> 1.0.1)
    # This allows: major updates, minor updates, and security updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      # react-router and react-router-dom ship as one release train on matching
      # version numbers, but dependabot bumps them independently. react-router
      # published an 8.x with no react-router-dom counterpart, so major bumps
      # split the pair and crash the router (see #616). Holding both at 7.x
      # keeps them in lockstep on minors; lift these together, by hand, once
      # react-router-dom has a matching major.
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x requires typescript <6.1.0, so 7.x fails npm
      # install. Lift once typescript-eslint supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
